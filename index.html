<style>
/* Layout (PC first): app bar / left menu / table of items / fixed-width detail pane on the right. Collapses to one column only on narrow windows. */
:root {
  --bg: #eef3ef;
  --surface: #ffffff;
  --surface-2: #f2f6f3;
  --surface-3: #e3ebe5;
  --line: #d0dcd3;
  --fg: #18251d;
  --muted: #56685c;
  --accent: #235f3c;
  --accent-fg: #ffffff;
  --accent-soft: #e2efe6;
  --ok: #13756a;  --ok-soft: #dcf0ec;
  --warn: #9a6200; --warn-soft: #fbefd6;
  --bad: #b3322a; --bad-soft: #fae3e0;
  --info: #3b5ba8; --info-soft: #e3e9f8;
  --font-display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1612; --surface: #17201a; --surface-2: #1b261f; --surface-3: #24312a; --line: #2e3d33;
    --fg: #e3ece5; --muted: #98aa9e; --accent: #8cc9a2; --accent-fg: #0d1a12; --accent-soft: #1d3326;
    --ok: #6cc8bb; --ok-soft: #133330; --warn: #e2b25a; --warn-soft: #36290f;
    --bad: #ef8a80; --bad-soft: #3a1c19; --info: #9db3ec; --info-soft: #1e2944;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1612; --surface: #17201a; --surface-2: #1b261f; --surface-3: #24312a; --line: #2e3d33;
    --fg: #e3ece5; --muted: #98aa9e; --accent: #8cc9a2; --accent-fg: #0d1a12; --accent-soft: #1d3326;
    --ok: #6cc8bb; --ok-soft: #133330; --warn: #e2b25a; --warn-soft: #36290f;
  --bad: #ef8a80; --bad-soft: #3a1c19; --info: #9db3ec; --info-soft: #1e2944;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 13.5px; line-height: 1.55; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* App bar */
.appbar { background: var(--accent); color: var(--accent-fg); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.appbar-inner { padding: 8px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { font-size: 16px; letter-spacing: .03em; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; line-height: 1.2; }
.brand h1 .themis { font-size: 26px; margin-left: 0; }
.brand h1 .subtitle { font-size: 15px; }
.sample { font-size: 11px; letter-spacing: .06em; padding: 1px 8px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); font-weight: 700; }
.who { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; }
.who select { padding: 4px 8px; border: 0; border-radius: 4px; background: var(--surface); color: var(--fg); }
.clock { opacity: .85; }

/* Shell */
.shell { display: grid; grid-template-columns: clamp(168px, 13vw, 200px) minmax(0, 1fr) clamp(330px, 29vw, 460px); gap: 0; min-height: calc(100vh - var(--appbar-h, 44px)); padding-inline: 0; }
@media (max-width: 1180px) { .shell { grid-template-columns: 180px minmax(0, 1fr); } .pane { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); } }
@media (max-width: 720px) { .shell { grid-template-columns: minmax(0, 1fr); } .menu { border-right: 0; border-bottom: 1px solid var(--line); } }

.menu { background: var(--surface); border-right: 1px solid var(--line); padding-block: 12px; padding-inline: 10px; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 14px; min-width: 0; }
.menu-group { display: grid; gap: 2px; }
.menu-title { font-size: 11px; color: var(--muted); letter-spacing: .08em; font-weight: 700; padding: 0 8px 4px; }
.menu button { display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 0; background: none; text-align: left; padding: 7px 8px; border-radius: 4px; }
.menu button:hover { background: var(--surface-2); }
.menu button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.menu .c { font-size: 12px; min-width: 22px; text-align: center; border-radius: 99px; padding: 0 6px; background: var(--surface-3); color: var(--fg); font-weight: 700; }
.menu .c.alert { background: var(--bad); color: var(--surface); }

.main { padding-block: 14px 32px; padding-inline: 16px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.banner { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); padding: 8px 12px; font-size: 12.5px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.panel-head { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.panel-head h2 { font-size: 14.5px; }
.panel-head .sub { color: var(--muted); font-size: 12px; }
.tools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tools input, .tools select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
.tools input { width: 220px; max-width: 100%; }

/* Tables */
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
td { white-space: normal; } td.num { white-space: nowrap; }
thead th { color: var(--muted); font-weight: 700; font-size: 12px; background: var(--surface-2); position: sticky; top: 0; }
td.title { white-space: normal; min-width: 150px; font-weight: 700; }
tbody tr.row { cursor: pointer; }
tbody tr.row:hover { background: var(--surface-2); }
tbody tr.row[aria-selected="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
td.r, th.r { text-align: right; }
.sub2 { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; }
.empty { padding: 28px 12px; color: var(--muted); text-align: center; }
.summary td.hot { color: var(--bad); font-weight: 700; }
.summary td.wait { color: var(--info); font-weight: 700; }
@media (min-width: 721px) {
  /* The left menu stays in place too; it scrolls on its own when taller than the window. */
  .menu { position: sticky; top: var(--appbar-h, 44px); align-self: start; height: calc(100vh - var(--appbar-h, 44px)); overflow-y: auto; overscroll-behavior: contain; z-index: 2; }
  .summary { position: sticky; top: var(--appbar-h, 44px); z-index: 3; box-shadow: 0 -14px 0 var(--bg), 0 6px 10px -6px rgba(0, 0, 0, .25); }
  #list, #notice, .panel[aria-label="使い方"] { scroll-margin-top: calc(var(--appbar-h, 44px) + var(--summary-h, 0px) + 12px); }
}
/* Same look as the menu's alert counts: a filled circle with a white number */
.summary td.pill-bad button.count, .summary td.pill-warn button.count, .summary td.pill-info button.count { text-decoration: none; display: inline-block; min-width: 24px; padding: 1px 7px; border-radius: 99px; text-align: center; color: #fff; font-weight: 700; box-sizing: border-box; }
.summary td.pill-bad button.count { background: var(--bad); }
.summary td.pill-warn button.count { background: #b98100; }
.summary td.pill-info button.count { background: #3b5ba8; }
.summary td.pill-bad button.count:hover, .summary td.pill-warn button.count:hover, .summary td.pill-info button.count:hover { filter: brightness(1.12); }
.summary tfoot td { font-weight: 700; }

.chip { display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px; white-space: nowrap; }
.imp-高 { background: var(--bad-soft); color: var(--bad); }
.imp-中 { background: var(--warn-soft); color: var(--warn); }
.imp-低 { background: var(--surface-3); color: var(--muted); }
.st-未回答 { background: var(--surface-3); color: var(--fg); }
.st-確認待ち { background: var(--info-soft); color: var(--info); }
.st-差戻し { background: var(--bad-soft); color: var(--bad); }
.st-承認済 { background: var(--ok-soft); color: var(--ok); }
.days { font-size: 11.5px; font-weight: 700; }
.days.late { color: var(--bad); }
.days.soon { color: var(--warn); }
.days.far { color: var(--muted); font-weight: 400; }
.over { color: var(--bad); font-weight: 700; }

/* Detail pane */
.pane { background: var(--surface); border-left: 1px solid var(--line); min-width: 0; }
.pane-inner { position: sticky; top: var(--appbar-h, 44px); max-height: calc(100vh - var(--appbar-h, 44px)); overflow-y: auto; padding: 16px; display: grid; gap: 14px; align-content: start; }
.pane h2 { font-size: 17px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.dates { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.date-card { background: var(--surface-2); border-radius: 6px; padding: 8px 10px; display: grid; gap: 2px; }
.date-card .k { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
.date-card .v { font-size: 15px; font-weight: 700; }
.date-card.key { background: var(--accent-soft); }
.meta { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 13px; margin: 0; }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; white-space: pre-wrap; }
.label { font-size: 12px; color: var(--muted); letter-spacing: .04em; font-weight: 700; }
.box { background: var(--surface-2); border-radius: 6px; padding: 9px 11px; font-size: 13px; white-space: pre-wrap; }
.box.reject { background: var(--bad-soft); border-left: 3px solid var(--bad); }
.section { display: grid; gap: 6px; }
form { display: grid; gap: 12px; }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; font-weight: 700; }
.field select, .field textarea, .field input { width: 100%; padding: 6px 9px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
.field textarea { min-height: 70px; resize: vertical; }
.req { color: var(--bad); font-size: 11px; margin-left: 4px; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.err { color: var(--bad); font-size: 12px; margin: 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 16px; border-radius: 4px; font-weight: 700; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.btn.bad { color: var(--bad); border-color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.history { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 12px; }
.history li { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px; color: var(--muted); }
.history li span:last-child { color: var(--fg); }

.mail { padding: 8px 12px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 90px 220px minmax(0, 1fr); gap: 10px; font-size: 12.5px; }
.mail:last-child { border-bottom: 0; }
.mail .t { color: var(--muted); }
.mail .to { color: var(--muted); }
.mail .subj { font-weight: 700; }
.mail.new { background: var(--accent-soft); }
@media (max-width: 720px) { .mail { grid-template-columns: minmax(0, 1fr); gap: 2px; } }

.appicon { flex: none; border-radius: 50%; }
.menu-logo { width: 100%; max-width: 176px; justify-self: center; border-radius: 6px; }
@media (max-width: 720px) { .menu-logo { display: none; } }
.themis { font-family: "Josefin Sans", "Century Gothic", "Futura", "Segoe UI", sans-serif; font-weight: 700; letter-spacing: .02em; margin-left: .2em; }
.help img { border-radius: 8px; }
table.wide td { white-space: nowrap; }
table.wide td.title { white-space: normal; min-width: 220px; }
table.wide td.ans { white-space: normal; min-width: 200px; max-width: 320px; }
.dept-sel { font: inherit; font-size: 12.5px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--fg); max-width: 170px; }
.sub2.pend { color: var(--info); font-weight: 700; }
.chip.nodept { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); margin-left: 6px; vertical-align: 1px; }
.dept-sel.undecided { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); font-weight: 700; }
[hidden] { display: none !important; }
.store-box .row2 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.chip.store { background: var(--info-soft); color: var(--info); border: 1px solid var(--info); margin-left: 6px; vertical-align: 1px; }
.chip.store.done { background: var(--surface); color: var(--muted); border-color: var(--line); }
.chip.store.late { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
.store-box { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 10px; margin-top: 14px; }
.store-box.open { border-color: var(--info); }
.store-head { display: flex; align-items: center; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; width: max-content; }
.seg label { cursor: pointer; position: relative; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; padding: 5px 14px; font-size: 13px; border-left: 1px solid var(--line); }
.seg label:first-child span { border-left: 0; }
.seg input:checked + span { background: var(--accent); color: var(--accent-fg); font-weight: 700; }
.seg input:focus-visible + span { outline: 2px solid var(--info); outline-offset: -2px; }
.decide { border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 10px 12px; display: grid; gap: 8px; }
.decide .label { color: var(--warn); }
.decide-row { display: flex; gap: 8px; flex-wrap: wrap; }
.decide-row select { flex: 1; min-width: 160px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
.helpbtn { border: 1px solid color-mix(in srgb, var(--accent-fg) 45%, transparent); background: transparent; color: var(--accent-fg); padding: 3px 10px; border-radius: 4px; font-size: 12px; font-weight: 700; }
.helpbtn:hover { background: color-mix(in srgb, var(--accent-fg) 14%, transparent); }
.help { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 16px; padding: 14px; align-items: start; }
.help img { width: 160px; height: 160px; }
.help ol, .help ul { margin: 0; padding-left: 1.4em; display: grid; gap: 4px; }
.help h3 { font-size: 13.5px; margin-bottom: 4px; }
.help .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
@media (max-width: 720px) { .help { grid-template-columns: minmax(0, 1fr); } }
th button.sort { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
th button.sort:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
th .arrow { font-size: 10px; color: var(--accent); }
td.ans { min-width: 112px; font-size: 12.5px; color: var(--muted); }
.ro { background: var(--surface-2); border: 1px dashed var(--line); border-radius: 6px; padding: 8px 10px; font-size: 12.5px; color: var(--muted); }
.toast { position: fixed; right: 24px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 6px; font-size: 13px; max-width: calc(100% - 32px); z-index: 10; }

.st-対応中 { background: var(--warn-soft); color: var(--warn); }
.st-反映待ち { background: var(--info-soft); color: var(--info); }
.st-完了 { background: var(--ok-soft); color: var(--ok); }
.menu .hint { font-size: 11.5px; overflow-wrap: anywhere; }
.menu .c { flex: none; }
.summary button.count { all: unset; cursor: pointer; min-width: 24px; text-align: right; padding: 1px 4px; border-radius: 4px; text-decoration: underline; text-underline-offset: 3px; }
.summary button.count:hover { background: var(--surface-3); }
.summary button.count:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.pane a { color: var(--accent); word-break: break-all; }
button.mail.notice { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
button.mail.notice:hover { background: var(--surface-2); }
button.mail.notice.new { background: var(--accent-soft); }
.admin-edit { border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; }
.admin-edit summary { cursor: pointer; font-weight: 700; font-size: 13px; color: var(--muted); }
.admin-edit[open] summary { margin-bottom: 10px; }
/* PC (3-column layout): a fixed app frame. The page itself never scrolls; the menu, the main
   column and the detail pane each scroll inside their own area, and 部門別の状況 stays at the
   top of the main column. Narrower windows keep the normal page scroll. */
@media (min-width: 1181px) {
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { margin: 0; display: flex; flex-direction: column; }
  .appbar { position: relative; top: 0; flex: none; }
  .shell { flex: 1 1 auto; min-height: 0; grid-template-rows: minmax(0, 1fr); }
  .menu, .main, .pane { min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .menu { position: static; height: auto; align-self: stretch; }
  .pane-inner { position: static; max-height: none; overflow: visible; }
  .summary { top: 0; }
  #list, #notice, .panel[aria-label="使い方"] { scroll-margin-top: calc(var(--summary-h, 0px) + 26px); }
}
/* Short PC screens: smaller logo and tighter menu so more of it fits without scrolling */
@media (min-width: 1181px) and (max-height: 860px) {
  .menu-logo { max-width: 112px; }
  .menu { gap: 8px; padding-block: 8px; }
  .menu button { padding-block: 5px; }
}
</style>

  async function graph(method, path, body, type, suffix = "") {
    const headers = { Authorization: "Bearer " + await token() };
    if (type) headers["Content-Type"] = type;
    const r = await fetch(GRAPH + enc(path) + suffix, { method, headers, body });
    if (!r.ok) {
      let msg = ""; try { msg = (await r.json()).error.message; } catch (e) {}
      const err = new Error(`OneDrive へのアクセスに失敗しました（${r.status}）${msg ? "：" + msg : ""}`);
      err.status = r.status; throw err;

  }

  async function readText(name) {
    const item = await (await graph("GET", `${CFG.folder}/${name}`)).json();
    const r = await fetch(item["@microsoft.graph.downloadUrl"], { cache: "no-store" });
    if (!r.ok) throw new Error(`${name} を読み込めませんでした（${r.status}）`);
    return r.text();
  }
  async function loadData() {
    const js = await readText(CFG.dataFile);
    const m = /^\s*window\.PORTAL_DATA\s*=\s*([\s\S]*?);?\s*$/.exec(js);
    if (!m) throw new Error(`${CFG.dataFile} の形式が想定と違います。`);
    return JSON.parse(m[1]);
  }

    await graph("PUT", `${CFG.folder}/${CFG.inbox}/${name}`, text, "application/json",
                ":/content?@microsoft.graph.conflictBehavior=fail");
  }

  return { init, loadData, upload, switchAccount, user: () => account && account.username, error: null };
})();

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");

// Free text such as "2027/09/01（関係規定）" still sorts and counts down by its first date.
const parseIn = d => { const m = /(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/.exec(d || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };

const lsGet = (k, fallback) => { try { const v = localStorage.getItem(k); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; } };

}

const pendingOf = id => Object.entries(local.pending).filter(([, p]) => p.id === id).sort((a, b) => a[1].sentAt - b[1].sentAt);

const answered = s => !NO_ANSWER.includes((s.answer || "").trim());
// Workflow stage: 確認待ち / 差戻し come from 承認状態; otherwise 完了 / 未回答 / 対応中 from the answer itself.
function stage(i) {
  const s = shown(i);
  if (s.appr === "確認待ち") return "確認待ち";
  if (s.appr === "差戻し") return "差戻し";
  if (resolved(s)) return "完了";
  return answered(s) ? "対応中" : "未回答";
}
const overdue = i => { const s = shown(i); return !resolved(s) && days(s.plan) !== null && days(s.plan) < 0; };
const soon = i => !resolved(shown(i)) && days(i.eff) !== null && days(i.eff) >= 0 && days(i.eff) <= 30;

// Scroll el to the top of its column. In the fixed PC frame only #main scrolls (scrollIntoView would also
// shift the page itself); otherwise the page scrolls as usual.
function reveal(el) {
  const main = $("#main");
  if (!el) return;
  if (getComputedStyle(main).overflowY === "auto" && main.contains(el)) {
    const margin = parseFloat(getComputedStyle(el).scrollMarginTop) || 0;
    main.scrollTo({ top: el.getBoundingClientRect().top - main.getBoundingClientRect().top + main.scrollTop - margin, behavior: "smooth" });
  } else {
    el.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}
function stickyOffsets() {
  const root = document.documentElement.style, bar = $(".appbar"), sum = $(".summary");
  root.setProperty("--appbar-h", `${bar ? bar.offsetHeight : 44}px`);
  root.setProperty("--summary-h", `${sum ? sum.offsetHeight : 0}px`);
}
window.addEventListener("resize", stickyOffsets);

// Unread notices of unfinished items only; 過去のお知らせ shows the rest (read ones and finished items).
function noticePanel(news) {
  const last = seen[role] || "";
  const active = activeNotices(news);
  const shownNews = showPastNotices ? news.slice(0, 30) : active;
  const past = news.length - active.length;
  return `<section class="panel" id="notice" aria-label="お知らせ">
    <div class="panel-head"><h2>${showPastNotices ? "過去のお知らせ" : "お知らせ"}（${isAdmin() ? "管理者" : esc(role)}宛て）</h2><span class="sub">${showPastNotices ? "既読のもの・完了した項目のものを含みます" : "未読で、完了していない項目のお知らせだけを表示します"}</span>
      <div class="tools">${active.length && !showPastNotices ? `<button class="btn" id="mark-read" type="button">既読にする</button>` : ""}
        ${past || showPastNotices ? `<button class="btn" id="toggle-past" type="button">${showPastNotices ? "未読だけに戻す" : `過去のお知らせを表示（${past}件）`}</button>` : ""}</div></div>
    ${shownNews.length ? shownNews.map(n => `<button class="mail notice ${!n.done && n.t > last ? "new" : ""}" data-open="${esc(n.id)}" type="button"><span class="t num">${esc(n.t.slice(5))}</span><span class="to">${esc(n.id)}${n.done ? "（完了）" : ""}</span><span class="subj">${esc(n.text)}</span></button>`).join("")
      : `<div class="empty">新しいお知らせはありません。</div>`}
  </section>`;
}

const COUNT_STATE = { open: "未回答", back: "差戻し", late: "完了予定超過", wait: "確認待ち", doing: "対応中", store: "店舗展開 未完了", done: "完了" };
function summary() {
  const rows = activeDepts().map(d => {
    const m = items.filter(i => shown(i).dept === d), c = s => m.filter(i => stage(i) === s).length;
    return { d, open: c("未回答"), back: c("差戻し"), late: m.filter(overdue).length, wait: c("確認待ち"), doing: c("対応中"), store: m.filter(rolloutOpen).length, done: c("完了") };
  });
  const sum = k => rows.reduce((a, r) => a + r[k], 0);
  const cell = (n, cls, d, k) => `<td class="r num ${n ? cls : ""}">${n ? `<button class="count" type="button" data-count="${k}" data-dept="${esc(d)}" title="${esc(d || "全部門")}の${esc(COUNT_STATE[k])}を一覧で表示">${n}</button>` : n}</td>`;
  const cols = [["open", "未回答", "pill-bad"], ["back", "差戻し", "pill-warn"], ["late", "完了予定超過", "pill-bad"], ["wait", "承認待ち", "pill-info"], ["doing", "対応中", "pill-warn"], ["store", "店舗展開 未完了", "pill-bad"], ["done", "完了", ""]];
  return `<section class="panel summary" aria-label="部門別の状況">
    <div class="panel-head"><h2>部門別の状況</h2><span class="sub">赤丸は対応が必要・黄丸は差戻し／対応中・青丸は承認待ち（数字をクリックすると一覧に絞り込み）</span></div>
    <div class="scroll"><table>
      <thead><tr><th>部門</th>${cols.map(([, t]) => `<th class="r">${t}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(r => `<tr><td>${esc(r.d)}</td>${cols.map(([k, , cls]) => cell(r[k], cls, r.d, k)).join("")}</tr>`).join("")}</tbody>
      <tfoot><tr><td>合計</td>${cols.map(([k, , cls]) => cell(sum(k), cls, "", k)).join("")}</tr></tfoot>
    </table></div></section>`;
}

      <div class="row2">
        <div class="field"><label for="r-stat">実施状況（会社全体）</label>
          <select id="r-stat"><option value="" ${s.rstat ? "" : "selected"}>選択してください</option>${["未実施", "実施済", "不要"].map(x => `<option ${x === s.rstat ? "selected" : ""}>${x}</option>`).join("")}</select></div>
        <div class="field"><label for="r-plan">実施予定日</label>
          <input id="r-plan" type="date" value="${esc(toInput(s.rplan))}">${s.rplan && !parse(s.rplan) ? `<p class="hint">現在の値：${esc(s.rplan)}</p>` : ""}</div>
        <div class="field" id="r-done-f"><label for="r-done" id="r-done-l">${rolloutDateLabel(s.rstat)}</label>
          <input id="r-done" type="date" value="${esc(toInput(s.rdone))}"></div>
      </div>
      <div class="field"><label for="r-memo">実施内容</label>
        <textarea id="r-memo" placeholder="例：全店に通達・掲示物を差し替え">${esc(s.rmemo)}</textarea></div>
      <p class="hint">未実施のときは実施予定日、実施済・不要のときは日付を入れてください（実施済・不要を選ぶと今日の日付が入ります）。</p>
    </div>`;
  const canSave = isAdmin() || editStatus;
  return `<form id="rollout" class="store-box ${rolloutOpen(i) ? "open" : ""}" novalidate>
    <div class="store-head"><span class="label">店舗展開</span></div>
    ${need}${isAdmin() || editStatus ? fields : record}
    ${canSave ? `<p class="err" id="r-err" hidden></p><div class="actions"><button class="btn primary" type="submit">店舗展開を保存</button></div>` : ""}
  </form>`;
}

function historySection(i) {
  const log = logOf(i).reverse();
  return `<div class="section"><span class="label">履歴</span>${log.length
    ? `<ul class="history">${log.map(h => `<li><span class="num">${esc(h.t.slice(5))}</span><span>${esc(h.to)}へ：${esc(h.text)}</span></li>`).join("")}</ul>`
    : `<p class="hint">まだ記録はありません。</p>`}</div>`;
}

function detail(i) {
  const s = shown(i), st = stage(i), waiting = pendingOf(i.id);
  const own = !isAdmin() && s.dept === role;
  const [impact, confirm] = splitImpact(i.impact);
  const head = `
    <div class="chips"><span class="num">${esc(i.id)}</span>${i.imp ? `<span class="chip imp-${esc(i.imp)}">重要度 ${esc(i.imp)}</span>` : ""}${chipStage(i)}</div>
    <h2>${esc(i.title)}</h2>
    <dl class="meta">
      ${i.law ? `<dt>改正法令</dt><dd>${esc(i.law)}</dd>` : ""}
      <dt>法改正一覧No.</dt><dd class="num">${esc(i.no) || "—"}</dd>
      <dt>状態区分</dt><dd>${esc(i.kubun) || "—"}</dd>
      <dt>主部門</dt><dd>${esc(s.dept) || "—"}${i.related ? `（関連：${esc(i.related)}）` : ""}</dd>
      ${i.registered ? `<dt>登録日</dt><dd class="num">${esc(i.registered)}</dd>` : ""}
      ${i.url ? `<dt>一次情報</dt><dd><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.url)}</a></dd>` : ""}
    </dl>
    <div class="dates">
      <div class="date-card"><span class="k">公布・公表日</span><span class="v num">${esc(i.pub) || "—"}</span></div>
      <div class="date-card key"><span class="k">施行・適用日</span><span class="v num">${esc(i.eff) || "—"}</span>${effBadge(i.eff)}</div>
      <div class="date-card"><span class="k">部門の完了予定日</span><span class="v num ${overdue(i) ? "over" : ""}">${esc(s.plan) || "未設定"}</span>${overdue(i) ? `<span class="days late">予定超過</span>` : ""}</div>
    </div>
    ${isAdmin() && undecided(i) ? `<div class="decide">
      <span class="label">担当部門が決まっていません（${esc(s.dept || "未設定")}）</span>
      <div class="decide-row"><select id="d-dept" aria-label="担当部門"><option value="">部門を選択してください</option>${depts.map(d => `<option>${esc(d)}</option>`).join("")}</select>
      <button class="btn primary" id="d-ok" type="button">この部門に決定</button></div>
      <p class="hint">決定すると、その部門に対応依頼のお知らせが届きます。</p></div>` : ""}
    <div class="section"><span class="label">社内影響</span><div class="box">${esc(impact) || "—"}</div></div>
    <div class="section"><span class="label">確認事項</span><div class="box">${esc(confirm) || "—"}</div></div>
    ${st === "差戻し" && s.reject ? `<div class="section"><span class="label">管理者からの差戻しコメント</span><div class="box reject">${esc(s.reject)}</div></div>` : ""}
    ${waiting.length ? `<div class="ro">送信済みで正本への反映待ちです（${esc(waiting[waiting.length - 1][1].sentText)}）。${waiting.some(([, p]) => p.stuck) ? "3日以上反映されていません。自動更新が止まっていないか確認してください。" : "反映後に「最新データを読み込む」を押すと確定します。"}
      <button class="btn" id="cancel-pending" type="button" style="margin-top:6px">送信済みの表示を取り消す</button></div>` : ""}`;

  let body;
  if (isAdmin()) {
    if (st === "確認待ち") {
      const afterEff = parseIn(s.plan) && parseIn(i.eff) && parseIn(s.plan) > parseIn(i.eff);
      body = `${answerView(s)}
        ${afterEff ? `<p class="err">完了予定日が施行日より後です。前倒しが必要か確認してください。</p>` : ""}
        ${rejectOpen ? `<form id="reject" novalidate>
            <div class="field"><label for="f-reject">差戻しコメント（${esc(s.dept)}に届きます）</label>
              <textarea id="f-reject" placeholder="例：完了予定日を施行日前に設定してください"></textarea></div>
            <p class="err" id="j-err" hidden>差戻しの理由を入力してください。</p>
            <div class="actions"><button class="btn bad" type="submit">差戻しを送信</button><button class="btn" type="button" id="cancel-reject">やめる</button></div>
          </form>`
        : `<div class="actions"><button class="btn ok" id="approve" type="button">承認</button><button class="btn bad" id="open-reject" type="button">差戻し</button></div>`}`;
    } else {
      body = `${st === "未回答" ? `<p class="hint">${undecided(i) ? "担当部門を決めると、その部門に対応依頼が届きます。" : `${esc(s.dept)}の回答待ちです。`}</p>` : answerView(s)}
        <details class="admin-edit"><summary>管理者が直接入力する</summary>${answerForm(s, "正本に反映する（承認済）", false)}</details>`;
    }
  } else if (own && ["未回答", "差戻し", "対応中"].includes(st)) {
    body = answerForm(s, st === "対応中" ? "進捗を送信（管理者の確認へ）" : "回答を送信（管理者の確認へ）", true);
  } else if (own) {
    body = `${answerView(s)}<p class="hint">${st === "確認待ち" ? "管理者の確認待ちです。" : "完了しています。"}</p>`;
  } else {
    body = `${st === "未回答" ? "" : answerView(s)}<p class="ro">${esc(s.dept)}の項目のため閲覧のみです。</p>`;
  }
  return `${head}${body}${rolloutSection(i)}${historySection(i)}`;
}

// ---- saving answer files into <ポータル>/回答
function idb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("houkaisei-portal", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("handles");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) { const db = await idb(); return new Promise(r => { const t = db.transaction("handles").objectStore("handles").get(key); t.onsuccess = () => r(t.result); t.onerror = () => r(null); }); }
async function idbSet(key, val) { const db = await idb(); return new Promise(r => { const t = db.transaction("handles", "readwrite"); t.objectStore("handles").put(val, key); t.oncomplete = () => r(); t.onerror = () => r(); }); }

async function loadHandle() {
  try {
    dirHandle = await idbGet("portal-dir");
    dirState = dirHandle ? await dirHandle.queryPermission({ mode: "readwrite" }) : "none";
  } catch (e) { dirHandle = null; dirState = "none"; }
}
async function connect() {
  if (!window.showDirectoryPicker) throw new Error("このブラウザーではフォルダーを選べません。");
  const dir = await window.showDirectoryPicker({ id: "houkaisei-portal", mode: "readwrite" });
  try { await dir.getFileHandle("portal-data.js"); }
  catch (e) { throw new Error("選んだフォルダーに portal-data.js がありません。「社内対応管理 › ポータル」を選んでください。"); }
  dirHandle = dir; dirState = "granted";
  await idbSet("portal-dir", dir);
}
async function writeAnswer(name, text) {
  if (!dirHandle) await connect();
  if ((await dirHandle.queryPermission({ mode: "readwrite" })) !== "granted" &&
      (await dirHandle.requestPermission({ mode: "readwrite" })) !== "granted") {
    throw new Error("保存先フォルダーへの書き込みが許可されませんでした。");
  }
  dirState = "granted";
  const inbox = await dirHandle.getDirectoryHandle("回答", { create: true });
  const fh = await inbox.getFileHandle(name, { create: true });
  const w = await fh.createWritable();
  await w.write(text);
  await w.close();
}
function downloadAnswer(name, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

// Writes one answer file for the changed fields (expected = what the 正本 will hold before it, including
// files still waiting); log = [{to, text}] lines the sync appends to 履歴. Returns true when it had to fall back
// to a download, null when cancelled.
async function sendChange(cur, values, kind, log) {
  const before = shown(cur), expected = {}, set = {};
  for (const k of Object.keys(values)) { expected[COLUMN[k]] = before[k] || ""; set[COLUMN[k]] = values[k]; }
  const d = new Date();
  const name = `answer-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}${String(d.getMilliseconds()).padStart(3, "0")}-${cur.id}-${kind}-${Math.random().toString(36).slice(2, 6)}.json`;
  const answer = { id: cur.id, expected, set };
  if (log && log.length) answer.log = log;
  const text = JSON.stringify({ createdAt: nowText(), by: role, answers: [answer] }, null, 1);
  let viaDownload = false;
  try { await writeAnswer(name, text); }
  catch (ex) {
    if (ex.name === "AbortError") return null;
    downloadAnswer(name, text); viaDownload = true;
    toast(`${ex.message} 回答ファイルをダウンロードしたので、「ポータル\\回答」フォルダーへ移してください。`);
  }
  local.pending[name] = { id: cur.id, kind, set: values, sentAt: Date.now(), sentText: nowText() };
  saveLocal();
  return viaDownload;
}
async function send(cur, values, kind, log, message) {
  const viaDownload = await sendChange(cur, values, kind, log);
  if (viaDownload === null) return;
  if (!viaDownload) toast(`${message} 1時間以内に正本Excelへ反映されます。`);
  rejectOpen = false;
  render();
}
const deptLog = (cur, text) => undecided(cur) ? [] : [{ to: shown(cur).dept, text: `${text}：${cur.title}` }];

function bind() {
  document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { view = b.dataset.view; selected = null; rejectOpen = false; render(); });
  document.querySelectorAll("[data-sel]").forEach(r => {
    const pick = () => { selected = r.dataset.sel; rejectOpen = false; render(); };
    r.onclick = pick;
    r.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } };
  });
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { view = "all"; selected = b.dataset.open; rejectOpen = false; q = ""; deptFilter = ""; stateFilter = ""; impFilter = ""; render(); });
  document.querySelectorAll("[data-sort]").forEach(b => b.onclick = () => {
    const k = b.dataset.sort; sort = sort.key === k ? { key: k, dir: -sort.dir } : { key: k, dir: 1 }; render();
  });
  const qi = $("#q");
  if (qi) qi.oninput = () => { q = qi.value.trim(); const pos = qi.selectionStart; render(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); };
  if ($("#imp")) $("#imp").onchange = e => { impFilter = e.target.value; render(); };
  if ($("#dept")) $("#dept").onchange = e => { deptFilter = e.target.value; selected = null; render(); };
  if ($("#state")) $("#state").onchange = e => { stateFilter = e.target.value; selected = null; render(); };
  if ($("#help-close")) $("#help-close").onclick = () => { helpOpen = false; render(); };
  $("#go-notice").onclick = () => { const n = $("#notice"); if (n) reveal(n); };
  if ($("#toggle-past")) $("#toggle-past").onclick = () => { showPastNotices = !showPastNotices; render(); };
  if ($("#mark-read")) $("#mark-read").onclick = () => { const news = notices(); if (news.length) { seen[role] = news[0].t; lsSet(SEEN_STORE, seen); } render(); };
  if ($("#toggle-record")) $("#toggle-record").onclick = () => { showRecord = !showRecord; lsSet("houkaisei-portal-record", showRecord); render(); };
  document.querySelectorAll("[data-count]").forEach(b => b.onclick = () => {
    view = "all"; deptFilter = b.dataset.dept; stateFilter = COUNT_STATE[b.dataset.count]; q = ""; impFilter = ""; selected = null; rejectOpen = false;
    render();
    reveal($("#list"));
  });
  if ($("#connect")) $("#connect").onclick = async () => {
    try { await connect(); toast("保存先に接続しました。"); }
    catch (e) { if (e.name !== "AbortError") toast(e.message); }
    render();
  };
  const cur = items.find(i => i.id === selected);

  const setDept = (it, value) => {
    const was = undecided(it), from = shown(it).dept;
    if (!value || value === from) return;
    const text = was ? `対応依頼：${it.title}（施行日 ${it.eff || "未定"}）` : `担当変更（${from}から移管）：${it.title}（施行日 ${it.eff || "未定"}）`;
    send(it, { dept: value }, "dept", [{ to: value, text }], was ? `担当部門を「${value}」に決定しました。` : `主部門を「${value}」に変更しました。`);
  };
  document.querySelectorAll(".dept-sel").forEach(sel => {
    sel.onclick = e => e.stopPropagation();
    sel.onkeydown = e => e.stopPropagation();
    sel.onchange = () => { const it = items.find(i => i.id === sel.dataset.dept); if (it) setDept(it, sel.value); };
  });
  const decide = $("#d-ok");
  if (decide) decide.onclick = () => { const value = $("#d-dept").value; if (!value) { toast("担当部門を選んでください。"); return; } setDept(cur, value); };
  const cancel = $("#cancel-pending");
  if (cancel) cancel.onclick = () => { for (const [f] of pendingOf(selected)) delete local.pending[f]; saveLocal(); render(); };

  const approve = $("#approve");
  if (approve) approve.onclick = () => send(cur, { appr: "承認済" }, "approve", deptLog(cur, `承認${resolved(shown(cur)) ? "（完了）" : ""}`), "承認しました。");
  if ($("#open-reject")) $("#open-reject").onclick = () => { rejectOpen = true; render(); $("#f-reject").focus(); };
  if ($("#cancel-reject")) $("#cancel-reject").onclick = () => { rejectOpen = false; render(); };
  const reject = $("#reject");
  if (reject) reject.onsubmit = e => {
    e.preventDefault();
    const text = $("#f-reject").value.trim();
    if (!text) { $("#j-err").hidden = false; $("#f-reject").focus(); return; }
    if (text.startsWith("=")) { $("#j-err").textContent = "先頭を「=」にはできません。"; $("#j-err").hidden = false; return; }
    send(cur, { appr: "差戻し", reject: text }, "reject", deptLog(cur, `差戻し「${text}」`), "差戻しました。");
  };

  const rform = $("#rollout");
  if (rform && rform.querySelector("button[type=submit]")) {
    const need = () => { const x = rform.querySelector("input[name=r-need]:checked"); return x ? x.value : shown(cur).rollout; };
    const sync = () => {
      if ($("#r-detail")) $("#r-detail").hidden = need() !== "要";
      if ($("#r-done-f")) { $("#r-done-f").hidden = !ROLLOUT_CLOSED.includes($("#r-stat").value); $("#r-done-l").textContent = rolloutDateLabel($("#r-stat").value); }
    };
    rform.querySelectorAll("input[name=r-need]").forEach(x => x.onchange = sync);
    if ($("#r-stat")) $("#r-stat").onchange = () => { const st = $("#r-stat").value; if (ROLLOUT_CLOSED.includes(st) && (!$("#r-done").value || st !== shown(cur).rstat)) $("#r-done").value = toInput(todayText()); sync(); };
    sync();
    rform.onsubmit = e => {
      e.preventDefault();
      const s = shown(cur), err = $("#r-err");
      const fail = msg => { err.textContent = msg; err.hidden = false; };
      const values = isAdmin() ? { rollout: need() } : {};
      if (need() === "要" && $("#r-stat")) {
        const stat = $("#r-stat").value;
        values.rstat = stat;
        values.rplan = fromInput($("#r-plan").value) || (parse(s.rplan) ? "" : s.rplan);
        values.rdone = ROLLOUT_CLOSED.includes(stat) ? fromInput($("#r-done").value) : "";
        values.rmemo = $("#r-memo").value.trim();
        if (!isAdmin() && !stat) return fail("実施状況を選んでください。");
        if (stat === "未実施" && !values.rplan) return fail("未実施のときは実施予定日を入れてください。");
        if (ROLLOUT_CLOSED.includes(stat) && !values.rdone) return fail(`${stat}のときは${rolloutDateLabel(stat)}を入れてください。`);
        if (values.rmemo.startsWith("=")) return fail("実施内容の先頭を「=」にはできません。");
      }
      const changed = Object.keys(values).filter(k => values[k] !== (s[k] || ""));
      if (!changed.length) return fail("変更がありません。");
      const set = {}; for (const k of changed) set[k] = values[k];
      const log = [];
      if (set.rollout === "要") log.push(...deptLog(cur, "店舗展開が「要」になりました。実施状況を入力してください"));
      if (ROLLOUT_CLOSED.includes(values.rstat) && (set.rstat || set.rdone)) log.push({ to: isAdmin() ? s.dept || ADMIN : ADMIN, text: `店舗展開 ${values.rstat}（${rolloutDateLabel(values.rstat)} ${values.rdone}）：${cur.title}` });
      else if (values.rstat === "未実施" && (set.rstat || set.rplan)) log.push({ to: isAdmin() ? s.dept || ADMIN : ADMIN, text: `店舗展開 実施予定 ${values.rplan}：${cur.title}` });
      send(cur, set, "rollout", log.filter(l => l.to && !UNDECIDED.includes(l.to)), "店舗展開を保存しました。");
    };
  }

  const form = $("#answer");
  if (!form) return;
  const required = !isAdmin();
  const syncReq = () => { if ($("#plan-req")) $("#plan-req").hidden = DONE.includes($("#f-status").value); };
  $("#f-status").onchange = syncReq; syncReq();
  form.onsubmit = e => {
    e.preventDefault();
    const s = shown(cur), err = $("#f-err");
    const fail = (msg, el) => { err.textContent = msg; err.hidden = false; if (el) el.focus(); };
    const status = $("#f-status").value, plan = fromInput($("#f-plan").value) || (parse(s.plan) ? "" : s.plan);
    const answer = $("#f-answer").value.trim(), next = $("#f-next").value.trim();
    if (required && !answer) return fail("部門回答を入力してください。", $("#f-answer"));
    if (required && !DONE.includes(status) && !plan) return fail("完了予定日を入力してください。", $("#f-plan"));
    if (required && plan && parse(plan) && parse(plan) < TODAY && plan !== s.plan) return fail("完了予定日に過去の日付は指定できません。", $("#f-plan"));
    if (answer.startsWith("=") || next.startsWith("=")) return fail("先頭を「=」にはできません。");
    const values = { status, plan, answer: answer || (answered(s) ? "(回答なし)" : s.answer || "(回答なし)"), next, appr: required ? "確認待ち" : "承認済" };
    const set = {}; for (const k of Object.keys(values)) if (values[k] !== (s[k] || "")) set[k] = values[k];
    if (!Object.keys(set).filter(k => k !== "appr").length) return fail("変更がありません。");
    const log = required
      ? [{ to: ADMIN, text: `${s.dept}が回答（${status}${plan ? "・完了予定 " + plan : ""}）：${cur.title}` }]
      : deptLog(cur, `管理者が回答を更新（${status}）`);
    send(cur, set, required ? "answer" : "admin", log, required ? "回答を送信しました。管理者の確認待ちになります。" : "保存しました。");
  };
}

$("#role").onchange = e => { role = e.target.value; lsSet(ROLE_STORE, role); view = view === "all" ? "all" : "todo"; selected = null; rejectOpen = false; q = ""; impFilter = ""; deptFilter = ""; stateFilter = ""; render(); };
// ---- web version: answers go straight to OneDrive (see WEB_PORTAL above)
if (window.WEB_PORTAL) {
  loadHandle = async () => { dirState = "web"; };
  connect = async () => { await WEB_PORTAL.switchAccount(); };
  writeAnswer = (name, text) => WEB_PORTAL.upload(name, text);
  dirState = "web";
  if (WEB_PORTAL.error) toast(WEB_PORTAL.error);
}
$("#reload").onclick = () => location.reload();
$("#help-open").onclick = () => { helpOpen = !helpOpen; render(); };
loadHandle().then(render);
render();
</script>
